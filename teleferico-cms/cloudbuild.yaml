steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-f"
      - teleferico-cms/Dockerfile
      - "-t"
      - >-
        ${_AR_HOSTNAME}/$PROJECT_ID/cloud-run-source-deploy/cms-staging-teleferico:$COMMIT_SHA
      - teleferico-cms
    id: Build
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        ${_AR_HOSTNAME}/$PROJECT_ID/cloud-run-source-deploy/cms-staging-teleferico:$COMMIT_SHA
    id: Push
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - "-c"
      - |
        set -euo pipefail

        gcloud run deploy "${_SERVICE_NAME}" \
          --image "${_AR_HOSTNAME}/$PROJECT_ID/cloud-run-source-deploy/cms-staging-teleferico:$COMMIT_SHA" \
          --region "${_DEPLOY_REGION}" \
          --platform "${_PLATFORM}" \
          --allow-unauthenticated \
          --port 1337 \
          --service-account "${_RUNTIME_SA}" \
          --set-cloudsql-instances "${_INSTANCE_CONNECTION_NAME}" \
          --set-env-vars "HOST=0.0.0.0,NODE_ENV=${_NODE_ENV},DATABASE_CLIENT=${_DATABASE_CLIENT},DATABASE_HOST=/cloudsql/${_INSTANCE_CONNECTION_NAME},DATABASE_PORT=5432,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GCS_BASE_PATH=${_GCS_BASE_PATH}" \
          --set-secrets "DATABASE_NAME=DATABASE_NAME_STAGING:latest,DATABASE_USERNAME=DATABASE_USERNAME_STAGING:latest,DATABASE_PASSWORD=DATABASE_PASSWORD_STAGING:latest,APP_KEYS=APP_KEYS_STAGING:latest,API_TOKEN_SALT=API_TOKEN_SALT_STAGING:latest,ADMIN_JWT_SECRET=ADMIN_JWT_SECRET_STAGING:latest,TRANSFER_TOKEN_SALT=TRANSFER_TOKEN_SALT_STAGING:latest,JWT_SECRET=JWT_SECRET_STAGING:latest"
    id: Deploy
    entrypoint: bash
timeout: 1600s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _PLATFORM: managed
  _DEPLOY_REGION: southamerica-east1
  _GCS_BASE_PATH: cms
  _DATABASE_CLIENT: postgres
  _RUNTIME_SA: teleferico-bariloche-2024@appspot.gserviceaccount.com
  _AR_HOSTNAME: southamerica-east1-docker.pkg.dev
  _NODE_ENV: staging
  _INSTANCE_CONNECTION_NAME: teleferico-bariloche-2024:southamerica-east1:teleferico-strapi-staging
  _SERVICE_NAME: cms-staging-teleferico
  _GCS_BUCKET_NAME: cms_staging_bucket
