# PRODUCCION NEXTJS

steps:
  - name: gcr.io/k8s-skaffold/pack
    args:
      - "-c"
      - >
        pack build
        "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"
        \
          --builder="gcr.io/buildpacks/builder:google-22" \
          --network=cloudbuild \
          --path=teleferico-app \
          --publish \
          --env="BUILD_STRAPI_BASE_URL=${_BUILD_STRAPI_BASE_URL}" \
          --env="BUILD_STRAPI_BUCKET_HOSTNAME=${_BUILD_STRAPI_BUCKET_HOSTNAME}" \
          --env="BUILD_STRAPI_BUCKET_PATHNAME=${_BUILD_STRAPI_BUCKET_PATHNAME}" \
          --env="CV_STORAGE_DRIVER=${_CV_STORAGE_DRIVER}" \
          --env="GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}" \
          --env="GCS_PRIVATE_BASE_PATH=${_GCS_PRIVATE_BASE_PATH}" \
          --env="GCS_SIGNED_URL_TTL_SECONDS=${_GCS_SIGNED_URL_TTL_SECONDS}" \
          --env="NEXT_PUBLIC_BASE_URL=${_BUILD_NEXT_PUBLIC_BASE_URL}" \
          --env="NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}" \
          --env="ENABLE_STATIC_LOCALE_PARAMS=${_ENABLE_STATIC_LOCALE_PARAMS}" \
          --env="BUILD_STRAPI_CONTENT_TOKEN=$$APP__PRODUCTION__BUILD_STRAPI_CONTENT_TOKEN"
    id: Buildpack
    entrypoint: sh
    secretEnv:
      - APP__PRODUCTION__BUILD_STRAPI_CONTENT_TOKEN
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - "-c"
      - |
        set -euo pipefail

        gcloud run deploy "${_SERVICE_NAME}" \
          --image "${_AR_HOSTNAME}/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/${_SERVICE_NAME}:$COMMIT_SHA" \
          --region "${_DEPLOY_REGION}" \
          --platform "${_PLATFORM}" \
          --service-account "${_RUNTIME_SA}" \
          --cpu "${_CPU}" \
          --memory "${_MEMORY}" \
          --concurrency "${_CONCURRENCY}" \
          --min-instances "${_MIN_INSTANCES}" \
          --max-instances "${_MAX_INSTANCES}" \
          --cpu-boost \
          --execution-environment gen2 \
          --allow-unauthenticated \
          --set-env-vars "BUILD_STRAPI_BASE_URL=${_BUILD_STRAPI_BASE_URL},AUTH_TRUST_HOST=${_AUTH_TRUST_HOST},NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY},NEXT_PUBLIC_BASE_URL=${_BUILD_NEXT_PUBLIC_BASE_URL},ALLOWED_PUBLIC_ORIGINS=${_ALLOWED_PUBLIC_ORIGINS},ENABLE_STATIC_LOCALE_PARAMS=${_ENABLE_STATIC_LOCALE_PARAMS},BUILD_STRAPI_BUCKET_HOSTNAME=${_BUILD_STRAPI_BUCKET_HOSTNAME},BUILD_STRAPI_BUCKET_PATHNAME=${_BUILD_STRAPI_BUCKET_PATHNAME},GMAIL_SENDER=${_GMAIL_SENDER},GMAIL_RECEIVER=${_GMAIL_RECEIVER},CV_STORAGE_DRIVER=${_CV_STORAGE_DRIVER},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GCS_PRIVATE_BASE_PATH=${_GCS_PRIVATE_BASE_PATH},GCS_SIGNED_URL_TTL_SECONDS=${_GCS_SIGNED_URL_TTL_SECONDS}" \
          --set-secrets "INTERNAL_API_KEY=APP__PRODUCTION__INTERNAL_API_KEY:latest,STRAPI_FORMS_TOKEN=APP__PRODUCTION__STRAPI_FORMS_TOKEN:latest,BUILD_STRAPI_CONTENT_TOKEN=APP__PRODUCTION__BUILD_STRAPI_CONTENT_TOKEN:latest,AUTH_SECRET=APP__PRODUCTION__AUTH_SECRET:latest,RECAPTCHA_SECRET_KEY=APP__PRODUCTION__RECAPTCHA_SECRET_KEY:latest,GOOGLE_CLIENT_ID=APP__PRODUCTION__GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=APP__PRODUCTION__GOOGLE_CLIENT_SECRET:latest,OAUTH_REFRESH_TOKEN=APP__PRODUCTION__OAUTH_REFRESH_TOKEN:latest,CSRF_STATE_SECRET=APP__PRODUCTION__CSRF_STATE_SECRET:latest,INIT_TOKEN=APP__PRODUCTION__INIT_TOKEN:latest" \
          --quiet
    id: Deploy
    entrypoint: bash
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
