tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - app-production-teleferico
availableSecrets:
  secretManager:
    - versionName: >-
        projects/384535443802/secrets/APP__PRODUCTION__BUILD_STRAPI_CONTENT_TOKEN/versions/latest
      env: APP__PRODUCTION__BUILD_STRAPI_CONTENT_TOKEN
