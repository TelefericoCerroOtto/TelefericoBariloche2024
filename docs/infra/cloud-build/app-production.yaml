# PRODUCCION NEXTJS
# Documented safe defaults for tb-71-form-protection:
# - FORM_PROTECTION_REDIS_URL comes from Secret Manager secret APP__PRODUCTION__FORM_PROTECTION_REDIS_URL at runtime.
# - Local development never uses managed Redis; it stays on a local Redis container at redis://127.0.0.1:6379.
# - FORM_PROTECTION_REDIS_NAMESPACE=production
# - FORM_PROTECTION_REDIS_CONNECT_TIMEOUT_MS=500
# - CONTACT_RATE_LIMIT_ENABLED=true
# - CONTACT_RATE_LIMIT_MAX=10
# - CONTACT_RATE_LIMIT_WINDOW_MS=3600000
# - CONTACT_EMAIL_LIMIT_ENABLED=true
# - CONTACT_EMAIL_LIMIT_MAX=5
# - CONTACT_EMAIL_LIMIT_WINDOW_MS=86400000
# - POSTULATION_RATE_LIMIT_ENABLED=true
# - POSTULATION_RATE_LIMIT_MAX=5
# - POSTULATION_RATE_LIMIT_WINDOW_MS=900000
# - POSTULATION_EMAIL_LIMIT_ENABLED=true
# - POSTULATION_EMAIL_LIMIT_MAX=2
# - POSTULATION_EMAIL_LIMIT_WINDOW_MS=2592000000
# - Live secret/env wiring for Redis must later go through the Docker MCP google-cloud-sdk container path, not this doc snapshot alone.

steps:
  - name: gcr.io/k8s-skaffold/pack
    args:
      - "-c"
      - >
        pack build
        "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"
        \
          --builder="gcr.io/buildpacks/builder:google-22" \
          --network=cloudbuild \
          --path=teleferico-app \
          --publish \
          --env="BUILD_STRAPI_BASE_URL=${_BUILD_STRAPI_BASE_URL}" \
          --env="BUILD_STRAPI_BUCKET_HOSTNAME=${_BUILD_STRAPI_BUCKET_HOSTNAME}" \
          --env="BUILD_STRAPI_BUCKET_PATHNAME=${_BUILD_STRAPI_BUCKET_PATHNAME}" \
          --env="CV_STORAGE_DRIVER=${_CV_STORAGE_DRIVER}" \
          --env="GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}" \
          --env="GCS_PRIVATE_BASE_PATH=${_GCS_PRIVATE_BASE_PATH}" \
          --env="GCS_SIGNED_URL_TTL_SECONDS=${_GCS_SIGNED_URL_TTL_SECONDS}" \
          --env="CONTACT_RATE_LIMIT_ENABLED=${_CONTACT_RATE_LIMIT_ENABLED}" \
          --env="CONTACT_RATE_LIMIT_MAX=${_CONTACT_RATE_LIMIT_MAX}" \
          --env="CONTACT_RATE_LIMIT_WINDOW_MS=${_CONTACT_RATE_LIMIT_WINDOW_MS}" \
          --env="CONTACT_EMAIL_LIMIT_ENABLED=${_CONTACT_EMAIL_LIMIT_ENABLED}" \
          --env="CONTACT_EMAIL_LIMIT_MAX=${_CONTACT_EMAIL_LIMIT_MAX}" \
          --env="CONTACT_EMAIL_LIMIT_WINDOW_MS=${_CONTACT_EMAIL_LIMIT_WINDOW_MS}" \
          --env="POSTULATION_RATE_LIMIT_ENABLED=${_POSTULATION_RATE_LIMIT_ENABLED}" \
          --env="POSTULATION_RATE_LIMIT_MAX=${_POSTULATION_RATE_LIMIT_MAX}" \
          --env="POSTULATION_RATE_LIMIT_WINDOW_MS=${_POSTULATION_RATE_LIMIT_WINDOW_MS}" \
          --env="POSTULATION_EMAIL_LIMIT_ENABLED=${_POSTULATION_EMAIL_LIMIT_ENABLED}" \
          --env="POSTULATION_EMAIL_LIMIT_MAX=${_POSTULATION_EMAIL_LIMIT_MAX}" \
          --env="POSTULATION_EMAIL_LIMIT_WINDOW_MS=${_POSTULATION_EMAIL_LIMIT_WINDOW_MS}" \
          --env="NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}" \
          --env="APP_INTERNAL_BASE_URL=${_APP_INTERNAL_BASE_URL}" \
          --env="NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}" \
          --env="ENABLE_STATIC_LOCALE_PARAMS=${_ENABLE_STATIC_LOCALE_PARAMS}" \
          --env="BUILD_STRAPI_CONTENT_TOKEN=$$APP__PRODUCTION__BUILD_STRAPI_CONTENT_TOKEN"
    id: Buildpack
    entrypoint: sh
    secretEnv:
      - APP__PRODUCTION__BUILD_STRAPI_CONTENT_TOKEN
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - "-c"
      - |
        set -euo pipefail

        # Se utiliza un archivo temporal para las variables de entorno para soportar
        # valores que contienen comas (como ALLOWED_PUBLIC_ORIGINS) sin que el 
        # CLI de gcloud las interprete como separadores de variables.
        cat > /tmp/runtime-env.yaml <<EOF
        BUILD_STRAPI_BASE_URL: "${_BUILD_STRAPI_BASE_URL}"
        AUTH_TRUST_HOST: "${_AUTH_TRUST_HOST}"
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}"
        NEXT_PUBLIC_SITE_URL: "${_NEXT_PUBLIC_SITE_URL}"
        APP_INTERNAL_BASE_URL: "${_APP_INTERNAL_BASE_URL}"
        ALLOWED_PUBLIC_ORIGINS: "${_ALLOWED_PUBLIC_ORIGINS}"
        ENABLE_STATIC_LOCALE_PARAMS: "${_ENABLE_STATIC_LOCALE_PARAMS}"
        BUILD_STRAPI_BUCKET_HOSTNAME: "${_BUILD_STRAPI_BUCKET_HOSTNAME}"
        BUILD_STRAPI_BUCKET_PATHNAME: "${_BUILD_STRAPI_BUCKET_PATHNAME}"
        GMAIL_SENDER: "${_GMAIL_SENDER}"
        GMAIL_RECEIVER: "${_GMAIL_RECEIVER}"
        CV_STORAGE_DRIVER: "${_CV_STORAGE_DRIVER}"
        GCS_BUCKET_NAME: "${_GCS_BUCKET_NAME}"
        GCS_PRIVATE_BASE_PATH: "${_GCS_PRIVATE_BASE_PATH}"
        GCS_SIGNED_URL_TTL_SECONDS: "${_GCS_SIGNED_URL_TTL_SECONDS}"
        FORM_PROTECTION_REDIS_NAMESPACE: "${_FORM_PROTECTION_REDIS_NAMESPACE}"
        FORM_PROTECTION_REDIS_CONNECT_TIMEOUT_MS: "${_FORM_PROTECTION_REDIS_CONNECT_TIMEOUT_MS}"
        CONTACT_RATE_LIMIT_ENABLED: "${_CONTACT_RATE_LIMIT_ENABLED}"
        CONTACT_RATE_LIMIT_MAX: "${_CONTACT_RATE_LIMIT_MAX}"
        CONTACT_RATE_LIMIT_WINDOW_MS: "${_CONTACT_RATE_LIMIT_WINDOW_MS}"
        CONTACT_EMAIL_LIMIT_ENABLED: "${_CONTACT_EMAIL_LIMIT_ENABLED}"
        CONTACT_EMAIL_LIMIT_MAX: "${_CONTACT_EMAIL_LIMIT_MAX}"
        CONTACT_EMAIL_LIMIT_WINDOW_MS: "${_CONTACT_EMAIL_LIMIT_WINDOW_MS}"
        POSTULATION_RATE_LIMIT_ENABLED: "${_POSTULATION_RATE_LIMIT_ENABLED}"
        POSTULATION_RATE_LIMIT_MAX: "${_POSTULATION_RATE_LIMIT_MAX}"
        POSTULATION_RATE_LIMIT_WINDOW_MS: "${_POSTULATION_RATE_LIMIT_WINDOW_MS}"
        POSTULATION_EMAIL_LIMIT_ENABLED: "${_POSTULATION_EMAIL_LIMIT_ENABLED}"
        POSTULATION_EMAIL_LIMIT_MAX: "${_POSTULATION_EMAIL_LIMIT_MAX}"
        POSTULATION_EMAIL_LIMIT_WINDOW_MS: "${_POSTULATION_EMAIL_LIMIT_WINDOW_MS}"
        EOF

        gcloud run deploy "${_SERVICE_NAME}" \
          --image "${_AR_HOSTNAME}/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/${_SERVICE_NAME}:$COMMIT_SHA" \
          --region "${_DEPLOY_REGION}" \
          --platform "${_PLATFORM}" \
          --service-account "${_RUNTIME_SA}" \
          --cpu "${_CPU}" \
          --memory "${_MEMORY}" \
          --concurrency "${_CONCURRENCY}" \
          --min-instances "${_MIN_INSTANCES}" \
          --max-instances "${_MAX_INSTANCES}" \
          --cpu-boost \
          --execution-environment gen2 \
          --network default \
          --subnet default \
          --vpc-egress private-ranges-only \
          --allow-unauthenticated \
          --env-vars-file /tmp/runtime-env.yaml \
          --set-secrets "INTERNAL_API_KEY=APP__PRODUCTION__INTERNAL_API_KEY:latest,STRAPI_FORMS_TOKEN=APP__PRODUCTION__STRAPI_FORMS_TOKEN:latest,FORM_PROTECTION_REDIS_URL=APP__PRODUCTION__FORM_PROTECTION_REDIS_URL:latest,BUILD_STRAPI_CONTENT_TOKEN=APP__PRODUCTION__BUILD_STRAPI_CONTENT_TOKEN:latest,AUTH_SECRET=APP__PRODUCTION__AUTH_SECRET:latest,RECAPTCHA_SECRET_KEY=APP__PRODUCTION__RECAPTCHA_SECRET_KEY:latest,GOOGLE_CLIENT_ID=APP__PRODUCTION__GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=APP__PRODUCTION__GOOGLE_CLIENT_SECRET:latest,OAUTH_REFRESH_TOKEN=APP__PRODUCTION__OAUTH_REFRESH_TOKEN:latest,CSRF_STATE_SECRET=APP__PRODUCTION__CSRF_STATE_SECRET:latest,INIT_TOKEN=APP__PRODUCTION__INIT_TOKEN:latest" \
          --quiet
    id: Deploy
    entrypoint: bash
