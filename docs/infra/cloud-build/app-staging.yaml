steps:
  - name: node@sha256:1471ea646673136b8308550ac14b36d847ffb21c24bc31828279e443c924e488
    id: GitHub deployment start
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        node .github/scripts/github-deployment.js start
    env:
      - GITHUB_DEPLOYMENTS_APP_ID=${_GITHUB_DEPLOYMENTS_APP_ID}
      - GITHUB_DEPLOYMENTS_INSTALLATION_ID=${_GITHUB_DEPLOYMENTS_INSTALLATION_ID}
      - GITHUB_DEPLOYMENTS_REPOSITORY=${_GITHUB_DEPLOYMENTS_REPOSITORY}
      - GITHUB_DEPLOYMENTS_ENVIRONMENT=${_GITHUB_DEPLOYMENTS_ENVIRONMENT}
      - GITHUB_DEPLOYMENTS_ENVIRONMENT_URL=${_GITHUB_DEPLOYMENTS_ENVIRONMENT_URL}
      - GITHUB_DEPLOYMENTS_LOG_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID
      - GITHUB_DEPLOYMENTS_TARGET_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID
      - BUILD_ID=$BUILD_ID
      - GITHUB_DEPLOYMENTS_COMMIT_SHA=$COMMIT_SHA
      - GITHUB_DEPLOYMENTS_METADATA_PATH=/workspace/github-deployment-metadata.json
    secretEnv:
      - GITHUB_DEPLOYMENTS_APP_PRIVATE_KEY
  - name: gcr.io/cloud-builders/docker@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c
    args:
      - "-c"
      - |
        set -u
        image="$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"
        DOCKER_BUILDKIT=1 docker build \
          --file teleferico-app/Dockerfile \
          --tag "$image" \
          --build-arg="NPM_CONFIG_OPTIONAL=true" \
          --build-arg="NPM_CONFIG_PREFER_OFFLINE=true" \
          --build-arg="NPM_CONFIG_CPU=x64" \
          --build-arg="NPM_CONFIG_OS=linux" \
          --build-arg="NPM_CONFIG_LIBC=glibc" \
          --build-arg="BUILD_STRAPI_BASE_URL=${_BUILD_STRAPI_BASE_URL}" \
          --build-arg="BUILD_STRAPI_BUCKET_HOSTNAME=${_BUILD_STRAPI_BUCKET_HOSTNAME}" \
          --build-arg="BUILD_STRAPI_BUCKET_PATHNAME=${_BUILD_STRAPI_BUCKET_PATHNAME}" \
          --build-arg="CV_STORAGE_DRIVER=${_CV_STORAGE_DRIVER}" \
          --build-arg="GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}" \
          --build-arg="GCS_PRIVATE_BASE_PATH=${_GCS_PRIVATE_BASE_PATH}" \
          --build-arg="GCS_SIGNED_URL_TTL_SECONDS=${_GCS_SIGNED_URL_TTL_SECONDS}" \
          --build-arg="CONTACT_RATE_LIMIT_ENABLED=${_CONTACT_RATE_LIMIT_ENABLED}" \
          --build-arg="CONTACT_RATE_LIMIT_MAX=${_CONTACT_RATE_LIMIT_MAX}" \
          --build-arg="CONTACT_RATE_LIMIT_WINDOW_MS=${_CONTACT_RATE_LIMIT_WINDOW_MS}" \
          --build-arg="CONTACT_EMAIL_LIMIT_ENABLED=${_CONTACT_EMAIL_LIMIT_ENABLED}" \
          --build-arg="CONTACT_EMAIL_LIMIT_MAX=${_CONTACT_EMAIL_LIMIT_MAX}" \
          --build-arg="CONTACT_EMAIL_LIMIT_WINDOW_MS=${_CONTACT_EMAIL_LIMIT_WINDOW_MS}" \
          --build-arg="POSTULATION_RATE_LIMIT_ENABLED=${_POSTULATION_RATE_LIMIT_ENABLED}" \
          --build-arg="POSTULATION_RATE_LIMIT_MAX=${_POSTULATION_RATE_LIMIT_MAX}" \
          --build-arg="POSTULATION_RATE_LIMIT_WINDOW_MS=${_POSTULATION_RATE_LIMIT_WINDOW_MS}" \
          --build-arg="POSTULATION_EMAIL_LIMIT_ENABLED=${_POSTULATION_EMAIL_LIMIT_ENABLED}" \
          --build-arg="POSTULATION_EMAIL_LIMIT_MAX=${_POSTULATION_EMAIL_LIMIT_MAX}" \
          --build-arg="POSTULATION_EMAIL_LIMIT_WINDOW_MS=${_POSTULATION_EMAIL_LIMIT_WINDOW_MS}" \
          --build-arg="NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}" \
          --build-arg="APP_INTERNAL_BASE_URL=${_APP_INTERNAL_BASE_URL}" \
          --build-arg="NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}" \
          --build-arg="ENABLE_STATIC_LOCALE_PARAMS=${_ENABLE_STATIC_LOCALE_PARAMS}" \
          --secret="id=BUILD_STRAPI_CONTENT_TOKEN,env=APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN" \
          .
        command_exit=$?
        if [ "$command_exit" -ne 0 ]; then
          printf 'build:%s\n' "$command_exit" > /workspace/github-deployment-command-result
          exit 0
        fi
        docker push "$image"
        command_exit=$?
        if [ "$command_exit" -ne 0 ]; then
          printf 'build:%s\n' "$command_exit" > /workspace/github-deployment-command-result
        fi
        exit 0
    id: Build and push image
    entrypoint: bash
    secretEnv:
      - APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - "-c"
      - |
        set -u

        if [ -f /workspace/github-deployment-command-result ]; then
          exit 0
        fi

        gcloud run deploy "${_SERVICE_NAME}" \
          --image "${_AR_HOSTNAME}/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/${_SERVICE_NAME}:$COMMIT_SHA" \
          --region "${_DEPLOY_REGION}" \
          --platform "${_PLATFORM}" \
          --service-account "${_RUNTIME_SA}" \
          --cpu "${_CPU}" \
          --memory "${_MEMORY}" \
          --concurrency "${_CONCURRENCY}" \
          --min-instances "${_MIN_INSTANCES}" \
          --max-instances "${_MAX_INSTANCES}" \
          --cpu-boost \
          --execution-environment gen2 \
          --network default \
          --subnet default \
          --vpc-egress private-ranges-only \
          --allow-unauthenticated \
          --set-env-vars "BUILD_STRAPI_BASE_URL=${_BUILD_STRAPI_BASE_URL},AUTH_TRUST_HOST=${_AUTH_TRUST_HOST},NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY},NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL},APP_INTERNAL_BASE_URL=${_APP_INTERNAL_BASE_URL},ENABLE_STATIC_LOCALE_PARAMS=${_ENABLE_STATIC_LOCALE_PARAMS},BUILD_STRAPI_BUCKET_HOSTNAME=${_BUILD_STRAPI_BUCKET_HOSTNAME},BUILD_STRAPI_BUCKET_PATHNAME=${_BUILD_STRAPI_BUCKET_PATHNAME},GMAIL_SENDER=${_GMAIL_SENDER},GMAIL_RECEIVER=${_GMAIL_RECEIVER},CV_STORAGE_DRIVER=${_CV_STORAGE_DRIVER},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GCS_PRIVATE_BASE_PATH=${_GCS_PRIVATE_BASE_PATH},GCS_SIGNED_URL_TTL_SECONDS=${_GCS_SIGNED_URL_TTL_SECONDS},FORM_PROTECTION_REDIS_NAMESPACE=${_FORM_PROTECTION_REDIS_NAMESPACE},FORM_PROTECTION_REDIS_CONNECT_TIMEOUT_MS=${_FORM_PROTECTION_REDIS_CONNECT_TIMEOUT_MS},CONTACT_RATE_LIMIT_ENABLED=${_CONTACT_RATE_LIMIT_ENABLED},CONTACT_RATE_LIMIT_MAX=${_CONTACT_RATE_LIMIT_MAX},CONTACT_RATE_LIMIT_WINDOW_MS=${_CONTACT_RATE_LIMIT_WINDOW_MS},CONTACT_EMAIL_LIMIT_ENABLED=${_CONTACT_EMAIL_LIMIT_ENABLED},CONTACT_EMAIL_LIMIT_MAX=${_CONTACT_EMAIL_LIMIT_MAX},CONTACT_EMAIL_LIMIT_WINDOW_MS=${_CONTACT_EMAIL_LIMIT_WINDOW_MS},POSTULATION_RATE_LIMIT_ENABLED=${_POSTULATION_RATE_LIMIT_ENABLED},POSTULATION_RATE_LIMIT_MAX=${_POSTULATION_RATE_LIMIT_MAX},POSTULATION_RATE_LIMIT_WINDOW_MS=${_POSTULATION_RATE_LIMIT_WINDOW_MS},POSTULATION_EMAIL_LIMIT_ENABLED=${_POSTULATION_EMAIL_LIMIT_ENABLED},POSTULATION_EMAIL_LIMIT_MAX=${_POSTULATION_EMAIL_LIMIT_MAX},POSTULATION_EMAIL_LIMIT_WINDOW_MS=${_POSTULATION_EMAIL_LIMIT_WINDOW_MS},MAINTENANCE_MODE=${_MAINTENANCE_MODE},FEEDBACK_CAPABILITY_ENABLED=true,FEEDBACK_CMS_ALLOWED_ORIGIN=${_FEEDBACK_CMS_ALLOWED_ORIGIN},FEEDBACK_TASK_QUEUE_PATH=${_FEEDBACK_TASK_QUEUE_PATH},FEEDBACK_WORKER_URL=${_FEEDBACK_WORKER_URL},FEEDBACK_WORKER_OIDC_AUDIENCE=${_FEEDBACK_WORKER_OIDC_AUDIENCE},FEEDBACK_TASK_INVOKER_EMAIL=${_FEEDBACK_TASK_INVOKER_EMAIL},FEEDBACK_WORKER_OIDC_PRINCIPAL=${_FEEDBACK_WORKER_OIDC_PRINCIPAL},FEEDBACK_VERTEX_PROJECT_ID=${_FEEDBACK_VERTEX_PROJECT_ID},FEEDBACK_PRIVATE_BUCKET=${_FEEDBACK_PRIVATE_BUCKET}" \
          --set-secrets "INTERNAL_API_KEY=APP__STAGING__INTERNAL_API_KEY:latest,STRAPI_FORMS_TOKEN=APP__STAGING__STRAPI_FORMS_TOKEN:latest,FORM_PROTECTION_REDIS_URL=APP__STAGING__FORM_PROTECTION_REDIS_URL:latest,BUILD_STRAPI_CONTENT_TOKEN=APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN:latest,AUTH_SECRET=APP__STAGING__AUTH_SECRET:latest,RECAPTCHA_SECRET_KEY=APP__STAGING__RECAPTCHA_SECRET_KEY:latest,GOOGLE_CLIENT_ID=APP__STAGING__GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=APP__STAGING__GOOGLE_CLIENT_SECRET:latest,OAUTH_REFRESH_TOKEN=APP__STAGING__OAUTH_REFRESH_TOKEN:latest,CSRF_STATE_SECRET=APP__STAGING__CSRF_STATE_SECRET:latest,INIT_TOKEN=APP__STAGING__INIT_TOKEN:latest,FEEDBACK_STRAPI_TOKEN=APP__STAGING__FEEDBACK_STRAPI_TOKEN:latest,FEEDBACK_SESSION_SIGNING_KEY=APP__STAGING__FEEDBACK_SESSION_SIGNING_KEY:latest,FEEDBACK_APP_CMS_TOKEN=APP__STAGING__FEEDBACK_APP_CMS_TOKEN:latest" \
          --quiet
        command_exit=$?
        if [ "$command_exit" -ne 0 ]; then
          printf 'deploy:%s\n' "$command_exit" > /workspace/github-deployment-command-result
        fi
        exit 0
    id: Deploy
    entrypoint: bash
  - name: node@sha256:1471ea646673136b8308550ac14b36d847ffb21c24bc31828279e443c924e488
    id: GitHub deployment finish
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        if [ -f /workspace/github-deployment-command-result ]; then
          IFS=: read -r phase command_exit < /workspace/github-deployment-command-result
          GITHUB_DEPLOYMENTS_STATE=failure node .github/scripts/github-deployment.js finish || true
          exit "$command_exit"
        fi
        GITHUB_DEPLOYMENTS_STATE=success node .github/scripts/github-deployment.js finish
    env:
      - GITHUB_DEPLOYMENTS_APP_ID=${_GITHUB_DEPLOYMENTS_APP_ID}
      - GITHUB_DEPLOYMENTS_INSTALLATION_ID=${_GITHUB_DEPLOYMENTS_INSTALLATION_ID}
      - GITHUB_DEPLOYMENTS_REPOSITORY=${_GITHUB_DEPLOYMENTS_REPOSITORY}
      - GITHUB_DEPLOYMENTS_ENVIRONMENT=${_GITHUB_DEPLOYMENTS_ENVIRONMENT}
      - GITHUB_DEPLOYMENTS_ENVIRONMENT_URL=${_GITHUB_DEPLOYMENTS_ENVIRONMENT_URL}
      - GITHUB_DEPLOYMENTS_LOG_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID
      - GITHUB_DEPLOYMENTS_TARGET_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID
      - BUILD_ID=$BUILD_ID
      - GITHUB_DEPLOYMENTS_COMMIT_SHA=$COMMIT_SHA
      - GITHUB_DEPLOYMENTS_METADATA_PATH=/workspace/github-deployment-metadata.json
    secretEnv:
      - GITHUB_DEPLOYMENTS_APP_PRIVATE_KEY
