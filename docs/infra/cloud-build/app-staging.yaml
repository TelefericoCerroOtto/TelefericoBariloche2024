# STAGING NEXTJS
# Snapshot note (TB-74): this file documents the intended trigger configuration.
# The live Cloud Build trigger must still be updated/applied out-of-repo.
# Documented safe defaults for tb-71-form-protection:
# - FORM_PROTECTION_REDIS_URL comes from Secret Manager secret APP__STAGING__FORM_PROTECTION_REDIS_URL at runtime.
# - Local development never uses managed Redis; it stays on a local Redis container at redis://127.0.0.1:6379.
# - FORM_PROTECTION_REDIS_NAMESPACE=staging
# - FORM_PROTECTION_REDIS_CONNECT_TIMEOUT_MS=500
# - CONTACT_RATE_LIMIT_ENABLED=true
# - CONTACT_RATE_LIMIT_MAX=10
# - CONTACT_RATE_LIMIT_WINDOW_MS=3600000
# - CONTACT_EMAIL_LIMIT_ENABLED=true
# - CONTACT_EMAIL_LIMIT_MAX=5
# - CONTACT_EMAIL_LIMIT_WINDOW_MS=86400000
# - POSTULATION_RATE_LIMIT_ENABLED=true
# - POSTULATION_RATE_LIMIT_MAX=5
# - POSTULATION_RATE_LIMIT_WINDOW_MS=900000
# - POSTULATION_EMAIL_LIMIT_ENABLED=true
# - POSTULATION_EMAIL_LIMIT_MAX=2
# - POSTULATION_EMAIL_LIMIT_WINDOW_MS=2592000000
# - Live secret/env wiring for Redis must later go through the Docker MCP google-cloud-sdk container path, not this doc snapshot alone.
# TB-119: the GitHub deployment reporter image is pinned to the Docker Hub
# node:22.16.0-bookworm-slim linux/amd64 OCI image manifest verified on 2026-09-04.

steps:
  - name: node@sha256:1471ea646673136b8308550ac14b36d847ffb21c24bc31828279e443c924e488
    id: GitHub deployment start
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        node .github/scripts/github-deployment.js start
    env:
      - GITHUB_DEPLOYMENTS_APP_ID=${_GITHUB_DEPLOYMENTS_APP_ID}
      - GITHUB_DEPLOYMENTS_INSTALLATION_ID=${_GITHUB_DEPLOYMENTS_INSTALLATION_ID}
      - GITHUB_DEPLOYMENTS_REPOSITORY=${_GITHUB_DEPLOYMENTS_REPOSITORY}
      - GITHUB_DEPLOYMENTS_ENVIRONMENT=${_GITHUB_DEPLOYMENTS_ENVIRONMENT}
      - GITHUB_DEPLOYMENTS_ENVIRONMENT_URL=${_GITHUB_DEPLOYMENTS_ENVIRONMENT_URL}
      - GITHUB_DEPLOYMENTS_LOG_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID
      - GITHUB_DEPLOYMENTS_TARGET_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID
      - BUILD_ID=$BUILD_ID
      - GITHUB_DEPLOYMENTS_COMMIT_SHA=$COMMIT_SHA
      - GITHUB_DEPLOYMENTS_METADATA_PATH=/workspace/github-deployment-metadata.json
    secretEnv:
      - GITHUB_DEPLOYMENTS_APP_PRIVATE_KEY
  - name: gcr.io/k8s-skaffold/pack
    args:
      - "-c"
      - |
        set -u
        pack build \
          "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA" \
          --builder="gcr.io/buildpacks/builder:google-22" \
          --network=cloudbuild \
          --path=teleferico-app \
          --publish \
          --env="NPM_CONFIG_OPTIONAL=true" \
          --env="NPM_CONFIG_PREFER_OFFLINE=true" \
          --env="NPM_CONFIG_CPU=x64" \
          --env="NPM_CONFIG_OS=linux" \
          --env="NPM_CONFIG_LIBC=glibc" \
          --env="BUILD_STRAPI_BASE_URL=${_BUILD_STRAPI_BASE_URL}" \
          --env="BUILD_STRAPI_BUCKET_HOSTNAME=${_BUILD_STRAPI_BUCKET_HOSTNAME}" \
          --env="BUILD_STRAPI_BUCKET_PATHNAME=${_BUILD_STRAPI_BUCKET_PATHNAME}" \
          --env="CV_STORAGE_DRIVER=${_CV_STORAGE_DRIVER}" \
          --env="GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}" \
          --env="GCS_PRIVATE_BASE_PATH=${_GCS_PRIVATE_BASE_PATH}" \
          --env="GCS_SIGNED_URL_TTL_SECONDS=${_GCS_SIGNED_URL_TTL_SECONDS}" \
          --env="CONTACT_RATE_LIMIT_ENABLED=${_CONTACT_RATE_LIMIT_ENABLED}" \
          --env="CONTACT_RATE_LIMIT_MAX=${_CONTACT_RATE_LIMIT_MAX}" \
          --env="CONTACT_RATE_LIMIT_WINDOW_MS=${_CONTACT_RATE_LIMIT_WINDOW_MS}" \
          --env="CONTACT_EMAIL_LIMIT_ENABLED=${_CONTACT_EMAIL_LIMIT_ENABLED}" \
          --env="CONTACT_EMAIL_LIMIT_MAX=${_CONTACT_EMAIL_LIMIT_MAX}" \
          --env="CONTACT_EMAIL_LIMIT_WINDOW_MS=${_CONTACT_EMAIL_LIMIT_WINDOW_MS}" \
          --env="POSTULATION_RATE_LIMIT_ENABLED=${_POSTULATION_RATE_LIMIT_ENABLED}" \
          --env="POSTULATION_RATE_LIMIT_MAX=${_POSTULATION_RATE_LIMIT_MAX}" \
          --env="POSTULATION_RATE_LIMIT_WINDOW_MS=${_POSTULATION_RATE_LIMIT_WINDOW_MS}" \
          --env="POSTULATION_EMAIL_LIMIT_ENABLED=${_POSTULATION_EMAIL_LIMIT_ENABLED}" \
          --env="POSTULATION_EMAIL_LIMIT_MAX=${_POSTULATION_EMAIL_LIMIT_MAX}" \
          --env="POSTULATION_EMAIL_LIMIT_WINDOW_MS=${_POSTULATION_EMAIL_LIMIT_WINDOW_MS}" \
          --env="NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}" \
          --env="APP_INTERNAL_BASE_URL=${_APP_INTERNAL_BASE_URL}" \
          --env="NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}" \
          --env="ENABLE_STATIC_LOCALE_PARAMS=${_ENABLE_STATIC_LOCALE_PARAMS}" \
          --env="BUILD_STRAPI_CONTENT_TOKEN=$$APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN"
        command_exit=$?
        if [ "$command_exit" -ne 0 ]; then
          printf 'build:%s\n' "$command_exit" > /workspace/github-deployment-command-result
        fi
        exit 0
    id: Buildpack
    entrypoint: sh
    secretEnv:
      - APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - "-c"
      - |
        set -u

        if [ -f /workspace/github-deployment-command-result ]; then
          exit 0
        fi

        gcloud run deploy "${_SERVICE_NAME}" \
          --image "${_AR_HOSTNAME}/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/${_SERVICE_NAME}:$COMMIT_SHA" \
          --region "${_DEPLOY_REGION}" \
          --platform "${_PLATFORM}" \
          --service-account "${_RUNTIME_SA}" \
          --cpu "${_CPU}" \
          --memory "${_MEMORY}" \
          --concurrency "${_CONCURRENCY}" \
          --min-instances "${_MIN_INSTANCES}" \
          --max-instances "${_MAX_INSTANCES}" \
          --cpu-boost \
          --execution-environment gen2 \
          --network default \
          --subnet default \
          --vpc-egress private-ranges-only \
          --allow-unauthenticated \
          --set-env-vars "BUILD_STRAPI_BASE_URL=${_BUILD_STRAPI_BASE_URL},AUTH_TRUST_HOST=${_AUTH_TRUST_HOST},NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY},NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL},APP_INTERNAL_BASE_URL=${_APP_INTERNAL_BASE_URL},ENABLE_STATIC_LOCALE_PARAMS=${_ENABLE_STATIC_LOCALE_PARAMS},BUILD_STRAPI_BUCKET_HOSTNAME=${_BUILD_STRAPI_BUCKET_HOSTNAME},BUILD_STRAPI_BUCKET_PATHNAME=${_BUILD_STRAPI_BUCKET_PATHNAME},GMAIL_SENDER=${_GMAIL_SENDER},GMAIL_RECEIVER=${_GMAIL_RECEIVER},CV_STORAGE_DRIVER=${_CV_STORAGE_DRIVER},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GCS_PRIVATE_BASE_PATH=${_GCS_PRIVATE_BASE_PATH},GCS_SIGNED_URL_TTL_SECONDS=${_GCS_SIGNED_URL_TTL_SECONDS},FORM_PROTECTION_REDIS_NAMESPACE=${_FORM_PROTECTION_REDIS_NAMESPACE},FORM_PROTECTION_REDIS_CONNECT_TIMEOUT_MS=${_FORM_PROTECTION_REDIS_CONNECT_TIMEOUT_MS},CONTACT_RATE_LIMIT_ENABLED=${_CONTACT_RATE_LIMIT_ENABLED},CONTACT_RATE_LIMIT_MAX=${_CONTACT_RATE_LIMIT_MAX},CONTACT_RATE_LIMIT_WINDOW_MS=${_CONTACT_RATE_LIMIT_WINDOW_MS},CONTACT_EMAIL_LIMIT_ENABLED=${_CONTACT_EMAIL_LIMIT_ENABLED},CONTACT_EMAIL_LIMIT_MAX=${_CONTACT_EMAIL_LIMIT_MAX},CONTACT_EMAIL_LIMIT_WINDOW_MS=${_CONTACT_EMAIL_LIMIT_WINDOW_MS},POSTULATION_RATE_LIMIT_ENABLED=${_POSTULATION_RATE_LIMIT_ENABLED},POSTULATION_RATE_LIMIT_MAX=${_POSTULATION_RATE_LIMIT_MAX},POSTULATION_RATE_LIMIT_WINDOW_MS=${_POSTULATION_RATE_LIMIT_WINDOW_MS},POSTULATION_EMAIL_LIMIT_ENABLED=${_POSTULATION_EMAIL_LIMIT_ENABLED},POSTULATION_EMAIL_LIMIT_MAX=${_POSTULATION_EMAIL_LIMIT_MAX},POSTULATION_EMAIL_LIMIT_WINDOW_MS=${_POSTULATION_EMAIL_LIMIT_WINDOW_MS},MAINTENANCE_MODE=${_MAINTENANCE_MODE},FEEDBACK_CAPABILITY_ENABLED=false" \
          --set-secrets "INTERNAL_API_KEY=APP__STAGING__INTERNAL_API_KEY:latest,STRAPI_FORMS_TOKEN=APP__STAGING__STRAPI_FORMS_TOKEN:latest,FORM_PROTECTION_REDIS_URL=APP__STAGING__FORM_PROTECTION_REDIS_URL:latest,BUILD_STRAPI_CONTENT_TOKEN=APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN:latest,AUTH_SECRET=APP__STAGING__AUTH_SECRET:latest,RECAPTCHA_SECRET_KEY=APP__STAGING__RECAPTCHA_SECRET_KEY:latest,GOOGLE_CLIENT_ID=APP__STAGING__GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=APP__STAGING__GOOGLE_CLIENT_SECRET:latest,OAUTH_REFRESH_TOKEN=APP__STAGING__OAUTH_REFRESH_TOKEN:latest,CSRF_STATE_SECRET=APP__STAGING__CSRF_STATE_SECRET:latest,INIT_TOKEN=APP__STAGING__INIT_TOKEN:latest" \
          --quiet
        command_exit=$?
        if [ "$command_exit" -ne 0 ]; then
          printf 'deploy:%s\n' "$command_exit" > /workspace/github-deployment-command-result
        fi
        exit 0
    id: Deploy
    entrypoint: bash
  - name: node@sha256:1471ea646673136b8308550ac14b36d847ffb21c24bc31828279e443c924e488
    id: GitHub deployment finish
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        if [ -f /workspace/github-deployment-command-result ]; then
          IFS=: read -r phase command_exit < /workspace/github-deployment-command-result
          GITHUB_DEPLOYMENTS_STATE=failure node .github/scripts/github-deployment.js finish || true
          exit "$command_exit"
        fi
        GITHUB_DEPLOYMENTS_STATE=success node .github/scripts/github-deployment.js finish
    env:
      - GITHUB_DEPLOYMENTS_APP_ID=${_GITHUB_DEPLOYMENTS_APP_ID}
      - GITHUB_DEPLOYMENTS_INSTALLATION_ID=${_GITHUB_DEPLOYMENTS_INSTALLATION_ID}
      - GITHUB_DEPLOYMENTS_REPOSITORY=${_GITHUB_DEPLOYMENTS_REPOSITORY}
      - GITHUB_DEPLOYMENTS_ENVIRONMENT=${_GITHUB_DEPLOYMENTS_ENVIRONMENT}
      - GITHUB_DEPLOYMENTS_ENVIRONMENT_URL=${_GITHUB_DEPLOYMENTS_ENVIRONMENT_URL}
      - GITHUB_DEPLOYMENTS_LOG_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID
      - GITHUB_DEPLOYMENTS_TARGET_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID
      - BUILD_ID=$BUILD_ID
      - GITHUB_DEPLOYMENTS_COMMIT_SHA=$COMMIT_SHA
      - GITHUB_DEPLOYMENTS_METADATA_PATH=/workspace/github-deployment-metadata.json
    secretEnv:
      - GITHUB_DEPLOYMENTS_APP_PRIVATE_KEY
