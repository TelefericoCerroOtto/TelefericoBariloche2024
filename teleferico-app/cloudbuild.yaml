steps:
  - name: gcr.io/k8s-skaffold/pack
    id: Buildpack
    entrypoint: sh
    args:
      - -c
      - |
        pack build "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA" \
          --builder="gcr.io/buildpacks/builder:v1" \
          --network=cloudbuild \
          --path=teleferico-app \
          --env="BUILD_STRAPI_BASE_URL=${_BUILD_STRAPI_BASE_URL}" \
          --env="BUILD_STRAPI_BUCKET_HOSTNAME=${_BUILD_STRAPI_BUCKET_HOSTNAME}" \
          --env="BUILD_STRAPI_BUCKET_PATHNAME=${_BUILD_STRAPI_BUCKET_PATHNAME}" \
          --env="NEXT_PUBLIC_BASE_URL=${_BUILD_NEXT_PUBLIC_BASE_URL}" \
          --env="NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY}" \
          --env="BUILD_STRAPI_CONTENT_TOKEN=$$APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN"
    secretEnv:
      - APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --platform=managed
      - --region=$_DEPLOY_REGION
      - --service-account=$_RUNTIME_SA
      - --quiet
      - --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - >-
        --update-env-vars=BUILD_STRAPI_BASE_URL=$_BUILD_STRAPI_BASE_URL,
        AUTH_TRUST_HOST=$_AUTH_TRUST_HOST,
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY=$_BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY,
        NEXT_PUBLIC_BASE_URL=$_BUILD_NEXT_PUBLIC_BASE_URL,
        BUILD_STRAPI_BUCKET_HOSTNAME=$_BUILD_STRAPI_BUCKET_HOSTNAME,
        BUILD_STRAPI_BUCKET_PATHNAME=$_BUILD_STRAPI_BUCKET_PATHNAME,
        GMAIL_SENDER=$_GMAIL_SENDER,
        GMAIL_RECEIVER=$_GMAIL_RECEIVER
      - >-
        --update-secrets=INTERNAL_API_KEY=APP__STAGING__INTERNAL_API_KEY:latest,
        STRAPI_FORMS_TOKEN=APP__STAGING__STRAPI_FORMS_TOKEN:latest,
        BUILD_STRAPI_CONTENT_TOKEN=APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN:latest,
        AUTH_SECRET=APP__STAGING__AUTH_SECRET:latest,
        RECAPTCHA_SECRET_KEY=APP__STAGING__RECAPTCHA_SECRET_KEY:latest,
        GOOGLE_CLIENT_ID=APP__STAGING__GOOGLE_CLIENT_ID:latest,
        GOOGLE_CLIENT_SECRET=APP__STAGING__GOOGLE_CLIENT_SECRET:latest,
        OAUTH_REFRESH_TOKEN=APP__STAGING__OAUTH_REFRESH_TOKEN:latest,
        CSRF_STATE_SECRET=APP__STAGING__CSRF_STATE_SECRET:latest,
        INIT_TOKEN=APP__STAGING__INIT_TOKEN:latest
images:
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _AR_HOSTNAME: southamerica-east1-docker.pkg.dev
  _TRIGGER_ID: 14cdf0d0-317d-40ac-a567-e3682c7c3283
  _SERVICE_NAME: teleferico-bariloche-staging
  _DEPLOY_REGION: southamerica-east1
  REPO_NAME: telefericobariloche2024
  _PLATFORM: managed
  _RUNTIME_SA: teleferico-bariloche-2024@appspot.gserviceaccount.com
  _BUILD_STRAPI_BASE_URL: https://cms-staging-teleferico-ra2cbgog2a-rj.a.run.app
  _BUILD_STRAPI_BUCKET_HOSTNAME: storage.googleapis.com
  _BUILD_STRAPI_BUCKET_PATHNAME: /cms_staging_bucket/**
  _BUILD_NEXT_PUBLIC_BASE_URL: https://teleferico-bariloche-staging-384535443802.southamerica-east1.run.app
  _AUTH_TRUST_HOST: "true"
  _BUILD_NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6LfCNkArAAAAAADLLHKHAsT-wokiRhyC1cnXFfSY
  _GMAIL_SENDER: contacto@telefericobariloche.com.ar
  _GMAIL_RECEIVER: contacto@telefericobariloche.com.ar
availableSecrets:
  secretManager:
    - versionName: projects/384535443802/secrets/APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN/versions/latest
      env: APP__STAGING__BUILD_STRAPI_CONTENT_TOKEN
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - teleferico-bariloche-staging
